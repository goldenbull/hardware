# 复制到 TF 卡根目录并重命名为 clock-config.ini。
# 每行 key = value；# 或 ; 开头是注释，[section] 行会被忽略。
# 任何一项缺失都会退回固件里编译时的默认值。

# Wi-Fi。留空则不联网，时间从 epoch 开始走，屏幕左上角显示“未校时”。
wifi_ssid = your-ssid
wifi_password = your-password

# 值两端的空格会被去掉。密码本身首尾带空格时用引号包起来：
# wifi_password = "  pass  "

ntp_server = ntp.aliyun.com

# POSIX TZ 字符串。东八区无夏令时即 CST-8（注意符号与 UTC+8 相反）。
timezone = CST-8

# 低于 cold_threshold 显示雪花，高于 hot_threshold 显示火焰，单位 °C。
# cold_threshold 必须小于 hot_threshold，否则两项一起回退到默认的 20 / 30。
cold_threshold = 20
hot_threshold = 30
